preprocessing_id: PP0002
version: v1.0.0
purpose: "Controlled RQ2 contrast-enhancement factor 1: standard CLAHE (clip_limit=2.0, tile_grid_size=[8,8]) matched identically to PP0001 geometry and split"
target_size: [640, 640]
preserve_aspect_ratio: true
pad_value: 114
channel_policy: "3_channel_grayscale_consistent_rgb_uint8"
strip_exif_xmp: true
contrast_enhancement:
  method: "clahe"
  clip_limit: 2.0
  tile_grid_size: [8, 8]
border_autocrop:
  enabled_for_datasets: ["DS0006"]
  black_threshold: 8
  margin_px: 8
  preserve_all_boxes: true
privacy_corner_mask:
  enabled_for_public_demo_and_figures_on_datasets: ["DS0003"]
  corner: "bottom_right"
  max_width_frac: 0.14
  max_height_frac: 0.10
  require_disjoint_from_boxes: true
normalization:
  scheme: "scale_0_to_1_float32"
  scale_factor: 0.00392156862745098
  cross_image_statistics_used: false
fit_on_partition: "none"
training_augmentation:
  enabled_in_training_only: true
  apply_to_val_or_test: false
  horizontal_flip_allowed_when_laterality_matters: false
  max_rotation_deg: 5.0
  scale_jitter_range: [0.90, 1.10]
  translation_frac: 0.05
  intensity_brightness_contrast_jitter: 0.10
  prohibited_transforms:
    - "vertical_flip"
    - "random_crop_dropping_boxes"
    - "color_hue_saturation_distortion"
    - "pre_split_offline_augmentation"
