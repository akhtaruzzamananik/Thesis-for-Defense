# T14 — Executable Experiment Configuration Schema (Planning Template — Nulls Prohibit Launch)
# Validated in STEP-025/027 per OS §5.2 and Blueprint STEP-024

schema_version: "T14-v1.0.0"

identity:
  experiment_id: null           # e.g. EXP0001
  research_question_ids: null   # e.g. ["RQ0", "RQ1"]
  purpose: null                 # "diagnostic_smoke" | "primary_baseline" | "comparator" | "rq2_ablation"
  parent_comparison_id: null    # e.g. null or "EXP0001"
  approval_record: null         # e.g. "DEC0012 / STEP-024"
  source_commit: null           # 40-char git SHA

data:
  release_id: null              # e.g. REL0001
  dataset_id: null              # e.g. DS0001
  annotation_id: null           # e.g. ANN0001
  split_id: null                # e.g. SPLIT0001
  preprocessing_id: null        # e.g. PP0001
  release_manifest_sha256: null
  split_manifest_sha256: null
  class_map_sha256: "c3f91dfc8a27e5a0dc4ca6324676dbcb78bb8460112e36f84032b295694640af"
  pp_config_sha256: null
  allowed_partitions: ["train", "val"]  # "test" strictly prohibited until G11 PASS!

model:
  candidate_id: null            # MC0001 | MC0002 | MC0003
  implementation: "ultralytics"
  package_version: "8.3.253"
  architecture: null            # yolo11s | yolov8s | yolo11m
  initial_weights: null         # yolo11s.pt | yolov8s.pt | yolo11m.pt
  initial_weights_sha256: null
  license_record: "AGPL-3.0"
  num_classes: null

training:
  seed: 20261124
  deterministic: true
  image_size: null              # 640 or 1280
  batch_size: null              # 16 (@640) or 4/8 (@1280)
  epochs: 100
  patience: 20
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  amp: true
  workers: 4
  selection_metric: "mAP@0.50"
  augmentations:
    degrees: 5.0
    translate: 0.05
    scale: 0.10
    hsv_v: 0.10
    fliplr: 0.0
    flipud: 0.0
    mosaic: 0.5
    close_mosaic: 10

runtime:
  platform: null                # "kaggle_gpu" | "local_cpu"
  environment_lock: "environment/model/requirements-kaggle.txt"
  hardware_record: null

evaluation:
  protocol_path: "09_Evaluation/protocol.md"
  protocol_sha256: null
  matching_iou: 0.50
  nms_iou: 0.65
  agnostic_nms: false
  max_detections: 300
  metric_conf_floor: 0.001
  operating_conf_threshold: null  # selected strictly on val at G11

outputs:
  checkpoint_policy: "08_Checkpoints/checkpoint_policy.md"
  artifact_destination: null      # off-Git storage path
